name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install editor client dependencies
        run: |
          npm ci --prefix editors/vscode
          npm ci --prefix editors/obsidian

      - name: Verify
        run: npm run verify

      - name: Build editor clients
        run: |
          npm run build --prefix editors/vscode
          npm run build --prefix editors/obsidian

      - name: Dry-run pack
        run: npm run pack:check
