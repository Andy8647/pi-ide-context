name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install editor client dependencies
        run: |
          npm ci --prefix editors/vscode
          npm ci --prefix editors/obsidian

      - name: Verify
        run: npm run verify

      # 社区目录读 repo 根的 manifest.json;插件 manifest 在 editors/obsidian/。保持一致。
      - name: Check root manifest matches the plugin manifest
        run: |
          if ! cmp -s manifest.json editors/obsidian/manifest.json; then
            echo "::error::Root manifest.json must match editors/obsidian/manifest.json (the community directory reads the root one). Update both."
            exit 1
          fi
          echo "Root manifest.json matches editors/obsidian/manifest.json."

      - name: Build editor clients
        run: |
          npm run build --prefix editors/vscode
          npm run build --prefix editors/obsidian

      - name: Dry-run pack
        run: npm run pack:check

  # JetBrains 客户端(editors/jetbrains):Kotlin ∪ Gradle,与上面的 npm 流水线互不影响。
  # 默认构建会下载一整份 IntelliJ IDEA CE 做编译基线,所以单独一个 job 并行跑。
  jetbrains:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build the plugin
        working-directory: editors/jetbrains
        run: ./gradlew test buildPlugin --console=plain

      - name: Upload the plugin zip
        uses: actions/upload-artifact@v5
        with:
          name: pi-ide-context-jetbrains
          path: editors/jetbrains/build/distributions/*.zip
          if-no-files-found: error
