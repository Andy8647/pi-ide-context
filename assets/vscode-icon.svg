<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img">
  <title>pi-ide-context</title>
  <!-- Marketplace icon: 128×128, mauve tile, dark editor window with a caret.
       Legible at 32px, so: one window, two text bars, one caret.
       Reproduce the PNG: rsvg-convert -w 128 -h 128 assets/vscode-icon.svg -o editors/vscode/icon.png -->
  <rect width="128" height="128" rx="28" fill="#cba6f7"/>

  <rect x="24" y="30" width="80" height="68" rx="10" fill="none" stroke="#11111b" stroke-width="7"/>
  <line x1="24" y1="48" x2="104" y2="48" stroke="#11111b" stroke-width="7"/>

  <rect x="38" y="60" width="30" height="7" rx="3.5" fill="#11111b"/>
  <rect x="38" y="76" width="46" height="7" rx="3.5" fill="#11111b" opacity="0.55"/>

  <rect x="78" y="58" width="7" height="28" rx="3.5" fill="#11111b"/>
</svg>
